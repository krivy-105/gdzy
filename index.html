function canEdit(){return !!(cloud&&me&&cloudRow&&cloudRow.owner_id===me.id);}
function needInit(){return !!(cloud&&me&&!cloudRow);}

function adoptPayload(p){
  data=p||{};

  if(!data.nodes)data.nodes=[];
  if(!data.title)data.title='后勤综合服务指南';

async function refreshMe(){
  if(!cloud){me=null;return;}
  try{
    var s=await cloud.auth.getSession();
    var u=(s&&s.data&&s.data.user)||(s&&s.data&&s.data.session&&s.data.session.user)||null;
    me=u?{id:u.id||u.uid||u.user_id,email:u.email}:null;
  }catch(e){me=null;}
}
function setOnline(v){if(cloudOnline===v)return;cloudOnline=v;if(!editMode)render();}
async function loadCloud(){
  if(!cloud)return;
  try{
    var r=await cloud.database.from('guide_content').select('id,owner_id,updated_at,payload').order('id',{ascending:true}).limit(1);
    if(r.error){setOnline(false);return;}
    setOnline(true);
    var row=(r.data&&r.data[0])||null;
    var changed=(!row&&cloudRow)||(row&&(!cloudRow||row.updated_at!==cloudRow.updated_at));
    cloudRow=row;
    if(cloudRow&&cloudRow.payload&&changed){
      adoptPayload(cloudRow.payload);cacheLocal();
      if(!editMode)render();
    }
  }catch(e){setOnline(false);}
}
async function publishCloud(){
  if(!cloud){toast('未连接云服务，无法发布');return;}
  if(!me){authModal();toast('请先登录管理员账号');return;}
  toast('发布中…');
  var payload={title:data.title,footer:data.footer,nodes:data.nodes};
  try{
    if(cloudRow){
      if(!canEdit()){toast('没有权限：该账号不能修改这份内容');return;}
      var r=await cloud.database.from('guide_content').update({payload:payload}).eq('id',cloudRow.id).select();
      if(r.error){toast('发布失败：'+r.error.message);return;}
      if(!r.data||!r.data.length){toast('没有权限：这份内容由其他账号创建');return;}
      cloudRow=r.data[0];
    }else{
      var r2=await cloud.database.from('guide_content').insert({payload:payload,note:'初始化'}).select();
      if(r2.error){toast('初始化失败：'+(r2.error.code==='42501'?'内容已存在，请刷新页面重试':r2.error.message));return;}
      cloudRow=(r2.data&&r2.data[0])||null;
    }
    cacheLocal();
    toast('已发布，所有人打开链接即可看到最新内容');
    render();
  }catch(e){toast('网络异常，发布失败，请稍后重试');}
}

/* ============ 树操作 ============ */
function walk(nodes,fn,parent,depth){
  depth=depth||0;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(fn(n,parent,depth,nodes,i)===false)return false;
    if(n.children&&n.children.length)walk(n.children,fn,n,depth+1);
  }
}
function find(id){
  var r=null;
  walk(data.nodes,function(n){if(n.id===id){r=n;return false;}});
  return r;
}
function parentOf(id){
  var r=null;
  walk(data.nodes,function(n,p){if(n.id===id){r=p;return false;}});
  return r;
}
function pathOf(id){
  var path=[];
  (function rec(nodes,stack){
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i],s=stack.concat([n]);
      if(n.id===id){path=s;return true;}
      if(n.children&&rec(n.children,s))return true;
    }
    return false;
  })(data.nodes,[]);
  return path;
}
function removeNode(id){
  walk(data.nodes,function(n,p,depth,arr,idx){if(n.id===id){arr.splice(idx,1);return false;}});
}

function crumbHTML(path){
  var h='<div class="crumb"><button data-act="go" data-id="">首页</button>';
  path.forEach(function(n){h+='<span>/</span><button data-act="go" data-id="'+n.id+'">'+esc(n.title)+'</button>';});
  return h+'</div>';
}
function searchHTML(q){
  var res=[];
  walk(data.nodes,function(n){
    var hay=(n.title+' '+n.desc+' '+JSON.stringify(n.blocks||[])||'').toLowerCase();
    if(hay.indexOf(q.toLowerCase())>=0)res.push(n);
  });
  var h='<div class="sec-title">搜索结果 '+res.length+' 条</div>';
  if(!res.length)return h+'<div class="empty">没有找到相关服务</div>';
  h+='<div class="list">';
  res.forEach(function(n){
    var p=pathOf(n.id).slice(0,-1).map(function(x){return x.title;}).join(' / ');
    h+='<div class="row" data-act="go" data-id="'+n.id+'"><div class="ic">'+(n.icon||'📋')+'</div>'
      +'<div class="m"><div class="t">'+esc(n.title)+'</div><div class="d">'+esc(p||'首页')+'</div></div><div class="arrow">›</div></div>';
  });
  return h+'</div>';
}
function renderHome(){
  var v=$('view'),h=syncBar();
  h+='<div class="search-box"><div class="search-in">'
    +'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'
    +'<input id="q" placeholder="搜索服务、地点、电话…" value="'+esc(query)+'"></div></div>';
  if(query.trim()){v.innerHTML=h+searchHTML(query.trim());bindQ();return;}
  if(favs.length){
    h+='<div class="sec-title">我的收藏</div><div class="list">';
    favs.forEach(function(id){var n=find(id);if(!n)return;
      h+='<div class="row" data-act="go" data-id="'+n.id+'"><div class="ic">'+(n.icon||'📋')+'</div>'
        +'<div class="m"><div class="t">'+esc(n.title)+'</div>'+(n.desc?'<div class="d">'+esc(n.desc)+'</div>':'')+'</div>'
        +'<div class="arrow">›</div></div>';
    });
    h+='</div>';
  }
  h+='<div class="sec-title">选择校区</div><div class="grid">';
  data.nodes.forEach(function(n){h+=cardHTML(n,'');});
  h+='</div>';
  if(!data.nodes.length)h+='<div class="empty">'+(cloud&&cloudOnline&&!cloudRow?'管理员还没有发布内容。请用第一个账号登录并点「初始化内容」':'内容加载中，请稍候…')+'</div>';
  h+=footHTML(true);
  v.innerHTML=h;bindQ();
}
function footHTML(withTime){
  var t=withTime&&cloudRow&&cloudRow.updated_at?new Date(cloudRow.updated_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  return (data.footer?'<div class="page-foot">'+esc(data.footer)+'</div>':'')
    +(t?'<div class="page-foot-sub">内容更新于 '+esc(t)+'</div>':'');
}
function bindQ(){
  var q=$('q');if(!q)return;
  q.addEventListener('input',function(){query=q.value;renderHome();var n=$('q');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}});
}
function renderNode(id){
  var n=find(id),v=$('view');
  if(!n){location.hash='';return;}
  curId=id;
  var path=pathOf(id);
  var h=crumbHTML(path);
  var isFav=favs.indexOf(id)>=0;
  h+='<div class="favbar"><button class="favbtn'+(isFav?' on':'')+'" data-act="fav" data-id="'+id+'">'+(isFav?'★ 已收藏':'☆ 收藏此页')+'</button>'
    +(editMode?'<button class="favbtn" style="margin-left:8px" data-act="ed-node" data-id="'+id+'">✎ 本页资料</button>':'')+'</div>';
  (n.blocks||[]).forEach(function(b,i){h+=blockHTML(b,n,i);});
  if(n.children&&n.children.length){
    h+='<div class="sec-title">'+(n.children.length)+' 个服务 / 子栏目</div><div class="list">';
    n.children.forEach(function(c){h+=rowHTML(c);});
    h+='</div>';
  }
  if(editMode)h+='<button class="addbtn" data-act="add-blk" data-id="'+id+'">＋ 添加内容块（文字 / 图片 / 流程 / 联系方式）</button>';
  if(!(n.blocks||[]).length&&!(n.children||[]).length&&!editMode){
    h+='<div class="empty">此页面暂无内容</div>';
  }
  h+=footHTML(false);
  v.innerHTML=h;
}
function render(){
  document.body.classList.toggle('editing',editMode);
  $('edit-tip').hidden=!editMode;
  var id=(location.hash||'').replace(/^#\/?/,'');
  if(!id){curId=null;renderHome();}
  else{renderNode(id);}
  $('btn-back').style.visibility=id?'visible':'hidden';
  $('tb-title').textContent=id?(find(id)?find(id).title:'后勤服务'):(data.title||'后勤综合服务指南');
  renderEditBar(id);
}
function renderEditBar(id){
  var e=$('editbar');
  if(!editMode){e.innerHTML='';return;}
  var pubBtn='<button data-bar="pub">发布到云端'+(isDirty()?' ●':'')+'</button>';
  if(!id){
    e.innerHTML='<div class="editbar"><button data-bar="add-root">＋ 添加校区</button>'+pubBtn+'<button class="ghost" data-bar="exit">退出编辑</button></div>';
  }else{
    e.innerHTML='<div class="editbar"><button data-bar="add-child">＋ 子栏目</button><button data-bar="add-blk">＋ 内容块</button>'+pubBtn+'<button class="ghost" data-bar="exit">退出编辑</button></div>';
  }
}

/* ============ 弹窗 ============ */
function modal(title,bodyHTML,btns){
  var root=$('modal-root');
  var h='<div class="mask"><div class="modal"><header>'+esc(title)+'<button class="x" data-close="1">×</button></header>'
    +'<div class="body">'+bodyHTML+'</div><footer>';
  (btns||[]).forEach(function(b,i){h+='<button class="'+(b.cls||'btn-g')+'" data-bi="'+i+'">'+esc(b.text)+'</button>';});
  h+='</footer></div></div>';
  root.innerHTML=h;
  var mask=root.querySelector('.mask');
  mask.addEventListener('click',function(e){
    if(e.target===mask)closeModal();
    var x=e.target.closest('[data-close]');if(x)closeModal();
    var b=e.target.closest('[data-bi]');
    if(b){var f=btns[+b.getAttribute('data-bi')];if(f&&f.cb)f.cb(root);}
  });
}
function closeModal(){$('modal-root').innerHTML='';}
function fld(label,inner,hint){
  return '<div class="fld"><label>'+esc(label)+'</label>'+inner+(hint?'<div class="hint">'+esc(hint)+'</div>':'')+'</div>';
}
var EMOJI=['🏫','🏥','🍽️','🛏️','🔧','💧','📦','💳','🚌','🧹','🚿','🔑','📋','🅿️','🏦','🧯','📞','🌳','🏛️','⭐','🚗','💡','🧺','🏃'];
function emojiHTML(cur){
  var h='<div class="emoji-pick">';
  EMOJI.forEach(function(e){h+='<button type="button" data-emo="'+e+'" class="'+(e===cur?'sel':'')+'">'+e+'</button>';});
  return h+'</div>';
}

/* ============ 节点编辑 ============ */
function nodeEditor(pid,nid){
  var node=nid?find(nid):null;
  var isNew=!node;
  var cur=(node&&node.icon)||(pid?'📋':'🏫');
  var body=fld('名称 / 标题','<input type="text" id="f-title" value="'+esc(node?node.title:'')+'" placeholder="如：医务室">')
    +fld('图标','<input type="text" id="f-icon" value="'+esc(cur)+'">'+emojiHTML(cur))
    +fld('一句话简介','<input type="text" id="f-desc" value="'+esc(node?node.desc:'')+'" placeholder="如：门诊 / 急诊 / 医保">')
    +'<div class="hint">提示：如果这一项下面还有细分内容，建立后进入该页面再点“添加子栏目”。</div>';
  modal(isNew?'添加栏目':'编辑栏目',body,[
    {text:isNew?'添加':'保存',cls:'btn-p',cb:function(root){
      var t=root.querySelector('#f-title').value.trim();
      if(!t){toast('请填写名称');return;}
      var icon=root.querySelector('#f-icon').value.trim()||'📋';
      var desc=root.querySelector('#f-desc').value.trim();
      if(isNew){
        var nn={id:uid(),icon:icon,title:t,desc:desc,blocks:[],children:[]};
        if(pid){var p=find(pid);if(p){if(!p.children)p.children=[];p.children.push(nn);}}
        else data.nodes.push(nn);
      }else{node.icon=icon;node.title=t;node.desc=desc;}
      save();closeModal();render();toast('已保存到本机，点「发布到云端」后所有人可见');
    }},
    {text:'取消',cb:closeModal}
  ]);
  $('modal-root').querySelector('.emoji-pick').addEventListener('click',function(e){
    var b=e.target.closest('[data-emo]');if(!b)return;
    $('f-icon').value=b.getAttribute('data-emo');
    [].forEach.call(this.children,function(x){x.classList.remove('sel');});
    b.classList.add('sel');
  });
}

/* ============ 内容块编辑 ============ */
var BTYPES=[
  ['info','信息表','地点 / 时间 / 说明，每行一条：标签|内容'],
  ['steps','流程步骤','每行一步，自动编号'],
  ['contact','联系方式','每行一条：姓名|电话|备注'],
  ['text','纯文字','可换行的大段说明'],
  ['tip','提示框','黄色高亮提示'],
  ['image','图片','上传照片，可配文字说明'],
  ['link','外部链接','跳转到办事系统或网页']
];
function pickBlockType(node){
  var h='';
  BTYPES.forEach(function(t,i){
    h+='<button class="mini" data-ti="'+i+'"><b>'+t[1]+'</b><div class="hint">'+esc(t[2])+'</div></button>';
  });
  modal('选择内容块类型',h,[{text:'取消',cb:closeModal}]);
  $('modal-root').querySelector('.body').addEventListener('click',function(e){
    var b=e.target.closest('[data-ti]');if(!b)return;
    var t=BTYPES[+b.getAttribute('data-ti')];
    closeModal();blockEditor(node,null,t[0]);
  });
}
function blockEditor(node,idx,type){
  var b=(idx!=null)?node.blocks[idx]:{type:type,title:'',items:[],value:'',src:'',caption:'',url:'',desc:''};
  var isNew=(idx==null);
  var body='',lines='';
  if(b.type==='info'||b.type==='steps'||b.type==='contact'){
    if(b.type==='info')lines=(b.items||[]).map(function(i){return i.label+'|'+i.value;}).join('\n');
    if(b.type==='steps')lines=(b.items||[]).join('\n');
    if(b.type==='contact')lines=(b.items||[]).map(function(i){return [i.name,i.phone,i.note].join('|');}).join('\n');
    var hint=b.type==='info'?'每行一条，格式：标签|内容（例：位置|中心校区 A 座一层）'
      :b.type==='steps'?'每行一步，会自动编号':'每行一条，格式：姓名|电话|备注（电话可直接点击拨号）';
    body=fld('小标题','<input type="text" id="f-bt" value="'+esc(b.title||'')+'">')
      +fld('内容',('<textarea id="f-bc" style="min-height:150px">'+esc(lines)+'</textarea>'),hint);
  }else if(b.type==='text'){
    body=fld('小标题','<input type="text" id="f-bt" value="'+esc(b.title||'')+'">')
      +fld('正文','<textarea id="f-bc" style="min-height:160px">'+esc(b.value||'')+'</textarea>','换行会原样显示');
  }else if(b.type==='tip'){
    body=fld('提示内容','<textarea id="f-bc">'+esc(b.value||'')+'</textarea>');
  }else if(b.type==='image'){
    body=fld('说明文字','<input type="text" id="f-bt" value="'+esc(b.caption||'')+'">')
      +fld('图片','<button class="mini" id="f-pick">选择图片（拍照 / 相册）</button>'
        +'<input type="file" id="f-file" accept="image/*" style="display:none">'
        +'<input type="hidden" id="f-src" value="'+esc(b.src||'')+'">'
        +'<div id="f-prev">'+(b.src?'<img class="img-prev" src="'+esc(b.src)+'">':'')+'</div>','单张建议不超过 2MB，会自动压缩');
  }else if(b.type==='link'){
    body=fld('小标题','<input type="text" id="f-bt" value="'+esc(b.title||'')+'">')
      +fld('按钮文字','<input type="text" id="f-bc" value="'+esc(b.desc||'')+'" placeholder="如：进入报修系统">')
      +fld('网址','<input type="text" id="f-url" value="'+esc(b.url||'')+'" placeholder="https://…">','留 http 前缀也可自动补全');
  }
  var btns=[];
  if(!isNew)btns.push({text:'删除',cls:'btn-d',cb:function(){
    if(!confirm('删除这个内容块？'))return;
    node.blocks.splice(idx,1);save();closeModal();render();toast('已删除');
  }});
  btns.push({text:'取消',cb:closeModal});
  btns.push({text:isNew?'添加':'保存',cls:'btn-p',cb:function(root){
    var t=root.querySelector('#f-bt')?root.querySelector('#f-bt').value.trim():'';
    var c=root.querySelector('#f-bc')?root.querySelector('#f-bc').value:'';
    var nb={type:b.type};
    if(b.type==='info'||b.type==='steps'||b.type==='contact'){
      var arr=String(c).split('\n').map(function(s){return s.trim();}).filter(function(s){return s;});
      nb.title=t||(b.type==='info'?'基本信息':b.type==='steps'?'办理流程':'联系方式');
      if(b.type==='info'){
        nb.items=arr.map(function(s){var i=s.indexOf('|');if(i<0)i=s.indexOf('：');if(i<0)i=s.indexOf(':');
          return i<0?{label:s,value:''}:{label:s.slice(0,i).trim(),value:s.slice(i+1).trim()};});
      }else if(b.type==='steps'){nb.items=arr;}
      else{nb.items=arr.map(function(s){var p=s.split('|');return {name:p[0]||'',phone:p[1]||'',note:p[2]||''};});}
    }else if(b.type==='text'){nb.title=t;nb.value=String(c);}
    else if(b.type==='tip'){nb.value=String(c);}
    else if(b.type==='image'){nb.caption=t;nb.src=root.querySelector('#f-src').value;}
    else if(b.type==='link'){nb.title=t;nb.desc=c.trim();nb.url=root.querySelector('#f-url').value.trim();}
    if(!node.blocks)node.blocks=[];
    if(isNew)node.blocks.push(nb);else node.blocks[idx]=nb;
    if(save()){closeModal();render();toast('已保存到本机，点「发布到云端」后所有人可见');}
  }});
  modal(isNew?'添加内容块':'编辑内容块',body,btns);
  if(b.type==='image'){
    var pick=$('f-pick'),file=$('f-file');
    pick.addEventListener('click',function(){file.click();});
    file.addEventListener('change',function(){
      if(!file.files||!file.files[0])return;
      toast('处理中…');
      compressImg(file.files[0],function(d){
        $('f-src').value=d;
        $('f-prev').innerHTML='<img class="img-prev" src="'+d+'">';
        toast('图片已就绪，记得点保存');
      });
    });
  }
}

/* ============ 菜单 ============ */
function openMenu(){
  var h='';
  if(!cloud)h+='<div class="hint" style="margin-bottom:10px">未连接云服务：当前只能改本机内容，其他人不会看到。请通过正式网址打开本页面。</div>';
  if(!me){
    h+='<button class="mini" data-m="login"><b>管理员登录</b><div class="hint">第一位注册并初始化内容的账号，将成为唯一拥有修改权限的管理员</div></button>';
  }else{
    h+='<div class="hint" style="margin-bottom:10px">已登录：'+esc(me.email||'管理员')
      +(needInit()?' · 尚未初始化内容':canEdit()?' · 唯一管理员':' · 该账号无修改权限')+'</div>';
    if(needInit())h+='<button class="mini" data-m="init"><b>初始化内容</b><div class="hint">把当前内容上传为第一版，此账号成为唯一管理员</div></button>';
    else if(canEdit()){
      h+='<button class="mini" data-m="edit">'+(editMode?'✓ 退出编辑模式':'开启编辑模式')+'</button>';
      h+='<button class="mini" data-m="pub"><b>发布到云端</b><div class="hint">发布后所有人打开链接即刻看到最新内容'+(isDirty()?'（当前有未发布改动）':'（当前已是最新）')+'</div></button>';
    }
    h+='<button class="mini" data-m="logout">退出登录</button>';
  }
  h+=((canEdit()||needInit())
      ?'<button class="mini" data-m="json">导出数据备份（JSON）</button>'
       +'<button class="mini" data-m="imp">从备份导入（JSON）</button>'
       +'<button class="mini" data-m="html">导出离线网页（HTML 快照）</button>'
       +'<button class="mini" data-m="title">修改标题 / 页脚署名</button>'
       +(canEdit()?'<button class="mini warn" data-m="reset">载入示例内容（覆盖本机草稿）</button>':'')
      :'')
    +'<div class="hint" style="margin-top:10px">工作方式：管理员登录后编辑内容，改动先存在本机；点「发布到云端」后，所有人的链接立即更新，不需要重新发布或重新分享。<br>安全保障：权限由服务端校验，只有第一位初始化内容的账号能改写内容，其余账号即使注册登录也只能浏览，页面上也没有任何编辑入口。<br><br>编辑说明：开启编辑模式后，卡片和文字块右上角出现 ✎（编辑）、✕（删除）与上下移动；底部工具栏可新增栏目和内容块。图片建议每张不超过 2MB。</div>';
  modal('设置与管理',h,[{text:'关闭',cb:closeModal}]);
  $('modal-root').querySelector('.body').addEventListener('click',function(e){
    var b=e.target.closest('[data-m]');if(!b)return;
    var m=b.getAttribute('data-m');closeModal();
    if(m==='login'){authModal();}
    else if(m==='init'){publishCloud();}
    else if(m==='edit'){
      if(editMode){editMode=false;render();toast('已退出编辑模式');}
      else if(canEdit()){editMode=true;render();toast('已进入编辑模式，改动发布后别人才看得到');}
      else{toast('该账号没有修改权限');}
    }
    else if(m==='pub'){publishCloud();}
    else if(m==='logout'){doSignOut();}
    else if(m==='json'){download('后勤服务数据备份.json',JSON.stringify(data,null,2),'application/json');toast('已导出备份');}
    else if(m==='imp'){if(!canEdit()&&!needInit()){toast('只有管理员可以导入备份');return;}
      var f=document.createElement('input');f.type='file';f.accept='.json,application/json';
      f.onchange=function(){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);
          if(!o||!o.nodes)throw 0;if(!confirm('导入将覆盖当前内容，继续？'))return;
          adoptPayload(o);save();render();toast('已导入，记得点「发布到云端」');}catch(e){toast('文件格式不正确');}};
        f.files[0]&&r.readAsText(f.files[0]);};f.click();}
    else if(m==='html'){exportHTML();}
    else if(m==='title'){if(!canEdit()&&!needInit()){toast('只有管理员可以修改');return;}titleEditor();}
    else if(m==='reset'){if(confirm('将清空当前所有内容并恢复为示例，确定？')){adoptPayload(JSON.parse(JSON.stringify(SAMPLE)));save();render();toast('已载入示例，记得点「发布到云端」');}}
  });
}
function isDirty(){
  if(!cloudRow||!cloudRow.payload)return true;
  try{
    return JSON.stringify({title:data.title,footer:data.footer,nodes:data.nodes})
      !==JSON.stringify({title:cloudRow.payload.title,footer:cloudRow.payload.footer,nodes:cloudRow.payload.nodes});
  }catch(e){return true;}
}
function titleEditor(){
  modal('标题与署名',
    '<div class="fld"><label>网站标题（显示在顶部）</label><input type="text" id="f-t" value="'+esc(data.title||'')+'"></div>'
    +'<div class="fld"><label>页脚署名（显示在每个页面底部）</label><input type="text" id="f-f" value="'+esc(data.footer||'')+'"></div>',[
    {text:'保存',cls:'btn-p',cb:function(root){
      data.title=root.querySelector('#f-t').value.trim()||'后勤综合服务指南';
      data.footer=root.querySelector('#f-f').value.trim();
      save();closeModal();render();toast('已保存，发布后别人才能看到');}},
    {text:'取消',cb:closeModal}
  ]);
}
function exportHTML(){
  var t=window.__APP_TPL__;
  if(!t){toast('导出功能不可用');return;}
  var title=esc(data.title||'后勤综合服务指南');
  var html='<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n'
    +'<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'
    +'<meta name="theme-color" content="#1668dc">\n<title>'+title+'<\/title>\n'
    +CLOUD_HEAD+'\n<style>'+t.css+'<\/style>\n<\/head>\n<body>\n'
    +t.body+'\n<script>window.__SEED__='+JSON.stringify(data).replace(/</g,'\\u003c')+';<\/script>\n'
    +'<script>'+t.js+'<\/script>\n<\/body>\n<\/html>';
  download('后勤服务指南-离线快照.html',html,'text/html;charset=utf-8');
  toast('已导出离线快照（内容固定，不会随云端更新）');
}

/* ============ 事件 ============ */
function go(id){
  if(id){location.hash='#/'+id;}else{location.hash='';}
  query='';
}
$('btn-back').addEventListener('click',function(){
  if(location.hash){
    var p=parentOf(curId);
    if(p)location.hash='#/'+p.id;else location.hash='';
  }
});
$('btn-menu').addEventListener('click',openMenu);
$('view').addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('blk-img')){
    var r=$('modal-root');
    r.innerHTML='<div class="mask" style="align-items:center;background:rgba(0,0,0,.92)"><img src="'+esc(e.target.getAttribute('src'))+'" style="max-width:100%;max-height:94vh;object-fit:contain"></div>';
    r.querySelector('.mask').addEventListener('click',function(){r.innerHTML='';});
    return;
  }
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='go'){go(b.getAttribute('data-id'));return;}
  var id=b.getAttribute('data-id')||curId;
  if(a==='fav'){
    var i=favs.indexOf(id);
    if(i>=0)favs.splice(i,1);else favs.push(id);
    try{localStorage.setItem(K.fav,JSON.stringify(favs));}catch(x){}
    render();toast(i>=0?'已取消收藏':'已加入收藏');
  }else if(a==='ed-node'){nodeEditor(parentOf(id)?parentOf(id).id:'',id);}
  else if(a==='del-node'){
    var n=find(id);
    if(!confirm('删除“'+(n?n.title:'')+'”及其下所有内容？'))return;
    removeNode(id);save();render();toast('已删除');
  }
  else if(a==='mv-node'){
    var p=parentOf(id),arr=p?p.children:data.nodes,d=+b.getAttribute('data-d');
    for(var i=0;i<arr.length;i++){if(arr[i].id===id){var j=i+d;if(j<0||j>=arr.length)return;
      var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;save();render();return;}}
  }
  else if(a==='add-blk'){pickBlockType(find(id));}
  else if(a==='ed-blk'){blockEditor(find(id),+b.getAttribute('data-i'));}
  else if(a==='del-blk'){
    if(!confirm('删除这个内容块？'))return;
    find(id).blocks.splice(+b.getAttribute('data-i'),1);save();render();toast('已删除');
  }
  else if(a==='mv-blk'){
    var nn=find(id),i2=+b.getAttribute('data-i'),d2=+b.getAttribute('data-d'),j2=i2+d2;
    if(j2<0||j2>=nn.blocks.length)return;
    var t2=nn.blocks[i2];nn.blocks[i2]=nn.blocks[j2];nn.blocks[j2]=t2;save();render();
  }
  else if(a==='signout'){doSignOut();}
});
$('editbar').addEventListener('click',function(e){
  var b=e.target.closest('[data-bar]');if(!b)return;
  var m=b.getAttribute('data-bar');
  if(m==='exit'){editMode=false;render();toast('已退出编辑模式');}
  else if(m==='add-root'){nodeEditor('',null);}
  else if(m==='add-child'){nodeEditor(curId,null);}
  else if(m==='add-blk'){pickBlockType(find(curId));}
  else if(m==='pub'){publishCloud();}
});
window.addEventListener('hashchange',render);
render();
/* 云端同步：进入时拉取最新，前台切换与每 60 秒自动刷新 */
(function startCloud(){
  if(!cloud)return;
  refreshMe().then(function(){if(me){loadCloud();render();}});
  loadCloud();
  setInterval(function(){if(!document.hidden)loadCloud();},60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)loadCloud();});
})();
})();
</script>
